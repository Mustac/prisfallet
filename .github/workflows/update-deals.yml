name: Update deals

on:
  schedule:
    - cron: "0 4 * * *"      # every day 04:00 UTC (05:00/06:00 Norwegian time)
  workflow_dispatch:          # "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover tests

      - name: Fetch feeds and build deals
        env:
          ADTRACTION_FEED_URLS: ${{ secrets.ADTRACTION_FEED_URLS }}
          ADTRACTION_TOKEN: ${{ secrets.ADTRACTION_TOKEN }}
          ADTRACTION_CHANNEL_ID: ${{ secrets.ADTRACTION_CHANNEL_ID }}
          ADTRACTION_PROGRAMS: ${{ secrets.ADTRACTION_PROGRAMS }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          DAISYCON_FEED_URLS: ${{ secrets.DAISYCON_FEED_URLS }}
          KELKOO_TOKEN: ${{ secrets.KELKOO_TOKEN }}
          PRISJAKT_CLIENT_ID: ${{ secrets.PRISJAKT_CLIENT_ID }}
          PRISJAKT_CLIENT_SECRET: ${{ secrets.PRISJAKT_CLIENT_SECRET }}
          PRISJAKT_REF: ${{ secrets.PRISJAKT_REF }}
        run: python scripts/update_deals.py

      - name: Save new data
        run: |
          git config user.name "prisfallet-bot"
          git config user.email "prisfallet-bot@users.noreply.github.com"
          git add data/deals.json data/price-history.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily deals update $(date -u +%F)"
            git push
          fi
